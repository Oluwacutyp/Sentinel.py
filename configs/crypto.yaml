# Sentinel.py — crypto preset (24/7, high vol, funding-aware)
engine:
  equity: 50000.0
  base_currency: USDT
  base_risk: 0.008
  max_positions: 8
  max_leverage: 3.0
  timeframe: 1h
  higher_timeframes: [4h, 1D]
  seed: 7

regime:
  lookback: 240
  trend_adx_like: 0.22
  squeeze_quantile: 0.12
  panic_vol_quantile: 0.96
  min_bars: 150

adaptive:
  enabled: true
  vol_window: 60
  scale_min: 0.4
  scale_max: 2.5
  recalibrate_bars: 400

signals:
  min_agreement: 0.58
  hysteresis: 0.10
  pattern_boost: 0.12
  pattern_veto: 0.85

ml:
  enabled: true
  threshold: 0.58
  retrain_bars: 1500
  embargo_bars: 24
  max_features: 64

risk:
  sizing: vol_target
  kelly_cap: 0.20
  vol_target: 0.25
  cppi_floor: 0.80
  cppi_multiple: 2.5
  stop_atr: 2.5
  time_stop_bars: 96
  breakeven_atr: 1.2
  daily_halt: -0.05
  max_drawdown: -0.20
  max_correlation: 0.80
  exposure_cap: 1.50

costs:
  fee_bps: 4
  slippage_atr: 0.08
  spread_bps: 3
  funding_8h_bps: 1
  latency_ms: 400

backtest:
  engine: event_driven
  warmup_bars: 400
  cash: 50000.0

live:
  dry_run: true
  poll_seconds: 30
  error_budget: 8
  panic_file: /tmp/sentinel_panic
