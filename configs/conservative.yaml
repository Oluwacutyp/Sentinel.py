# Sentinel.py — conservative preset (capital preservation first)
engine:
  equity: 200000.0
  base_currency: USD
  base_risk: 0.003
  max_positions: 4
  max_leverage: 1.0
  timeframe: 4h
  higher_timeframes: [1D, 1W]
  seed: 5

regime: { lookback: 250, squeeze_quantile: 0.20, panic_vol_quantile: 0.93 }
adaptive: { enabled: true, vol_window: 60, scale_min: 0.6, scale_max: 1.8, recalibrate_bars: 600 }
signals: { min_agreement: 0.65, hysteresis: 0.05, pattern_boost: 0.06, pattern_veto: 0.92 }
ml: { enabled: true, threshold: 0.62, retrain_bars: 3000, embargo_bars: 30, max_features: 48 }

risk:
  sizing: cppi
  cppi_floor: 0.92
  cppi_multiple: 2.0
  kelly_cap: 0.10
  vol_target: 0.06
  stop_atr: 3.0
  time_stop_bars: 150
  breakeven_atr: 1.5
  daily_halt: -0.015
  max_drawdown: -0.08
  max_correlation: 0.60
  exposure_cap: 0.50

costs: { fee_bps: 3, slippage_atr: 0.04, spread_bps: 2, funding_8h_bps: 1, latency_ms: 500 }
backtest: { engine: event_driven, warmup_bars: 300, cash: 200000.0 }
live: { dry_run: true, poll_seconds: 120, error_budget: 4, panic_file: /tmp/sentinel_panic }
