[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-py"
version = "2.0.0"
description = "Sentinel.py — Divine Quantum Adaptive Algorithmic Trading System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
keywords = ["trading", "algorithmic-trading", "quant", "backtest", "technical-analysis", "machine-learning"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
live = ["ccxt>=4.0", "yfinance>=0.2"]
speed = ["numba>=0.57"]
viz = ["plotly>=5.15"]
cli = ["typer>=0.9", "rich>=13.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]
all = ["ccxt>=4.0", "yfinance>=0.2", "numba>=0.57", "plotly>=5.15", "typer>=0.9", "rich>=13.0", "pytest>=7.0", "ruff>=0.1"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
